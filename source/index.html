<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ziki prototype · Owner Mandates</title>
<meta name="description" content="A clickable prototype of Ziki with Owner Mandates: agents act on their own inside rules their owner sets, and the owner sees only what crosses the line. UI only, sample data.">
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css">
<script>
  try {
    var t = localStorage.getItem("zm-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<noscript><p style="padding:24px;font-family:system-ui">This prototype needs JavaScript.</p></noscript>
<script src="/app.js"></script>
</body>
